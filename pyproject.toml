[project]
name = "placax"
version = "0.0.1"
description = "A fast, shared JAX environment for chip macro placement research"
requires-python = ">=3.12"
dependencies = [
    "jax",
    "flax",
    "optax",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]
cuda = ["jax[cuda13]"]
cuda12 = ["jax[cuda12]"]
resnet = ["flaxmodels"]
viz = ["matplotlib", "pillow"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["placax*", "placax_agents*", "placax_tools*", "placax_viz*"]

[tool.pytest.ini_options]
# Scoped explicitly: --use_docker clones DREAMPlace's full source (its own pybind11/etc. test suites
# included) into placax_tools/dreamplace/DREAMPlace/ - gitignored, but still on disk, so unscoped
# discovery would try (and fail) to collect tests that were never ours to run.
testpaths = ["tests"]
